name: CI

on:
  push:
    branches: [master]
    # Pushing a version tag such as v7.1.0 (or v7.1.0-beta.1 for a prerelease) builds, tests and publishes a release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to release from master, such as v7.1.0 (leave empty for a normal CI run)'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The release being built: the pushed v* tag, or the version given to a manual run. Empty for ordinary CI runs.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || '' }}

jobs:
  build:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Shapeshifter.slnx -c Release
      - name: Unit tests
        run: dotnet test --project tests/Shapeshifter.Core.Tests -c Release --no-build

  e2e-linux:
    name: End-to-end (Linux, X11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install X server and window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb openbox x11-utils
      - name: Build
        run: dotnet build tests/Shapeshifter.EndToEnd.Tests -c Release
      - name: Copy and paste between real applications
        env:
          SHAPESHIFTER_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: scripts/run-e2e-linux.sh -c Release --no-build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linux-logs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  e2e-windows:
    name: End-to-end (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build tests/Shapeshifter.EndToEnd.Tests -c Release
      - name: Copy and paste between real applications
        env:
          SHAPESHIFTER_E2E: '1'
          SHAPESHIFTER_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: dotnet test --project tests/Shapeshifter.EndToEnd.Tests -c Release --no-build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows-logs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  screenshots:
    name: Screenshots
    # Renders the picker with sample content (scripts/generate-screenshots.sh) so assets/screenshots always shows the
    # current design. On pull requests from this repository, changed screenshots are committed to the branch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Render the picker
        run: scripts/generate-screenshots.sh
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: assets/screenshots
      - name: Commit changed screenshots
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [[ -z "$(git status --porcelain -- assets/screenshots)" ]]; then
            echo "The screenshots are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots
          git commit -m "Update screenshots"
          git push

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, archive: zip }
          - { rid: win-arm64, os: windows-latest, archive: zip }
          - { rid: osx-arm64, os: macos-latest, archive: zip }
          - { rid: osx-x64, os: macos-latest, archive: zip }
          - { rid: linux-x64, os: ubuntu-latest, archive: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version from release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Manual releases must be run on master, not $GITHUB_REF"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$RELEASE_TAG is not a version tag like v7.1.0 or v7.1.0-beta.1"
            exit 1
          fi
          echo "VERSION_ARGS=-p:Version=$version" >> "$GITHUB_ENV"
      - name: Publish self-contained single-file build
        shell: bash
        run: dotnet publish src/Shapeshifter.Desktop -c Release -r ${{ matrix.rid }} -o publish/Shapeshifter $VERSION_ARGS
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/Shapeshifter -DestinationPath Shapeshifter-${{ matrix.rid }}.zip
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf Shapeshifter-${{ matrix.rid }}.tar.gz -C publish Shapeshifter
      - uses: actions/upload-artifact@v7
        with:
          name: Shapeshifter-${{ matrix.rid }}
          path: Shapeshifter-${{ matrix.rid }}.${{ matrix.archive }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build, e2e-linux, e2e-windows, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Shapeshifter-*
          path: dist
          merge-multiple: true
      - name: Create the release with the builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            target=(--verify-tag)
          elif gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; push the tag instead of starting a manual release"
            exit 1
          else
            # A manual run on master: create the tag on the commit that was built and tested.
            target=(--target "$GITHUB_SHA")
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # The release was created in the GitHub UI together with the tag: keep its notes, attach the builds.
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* "${target[@]}" --title "Shapeshifter ${RELEASE_TAG#v}" --generate-notes "${prerelease[@]}"
          fi
