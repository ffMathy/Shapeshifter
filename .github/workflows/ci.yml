name: CI

on:
  push:
    # Every merge to master is released (see the version job); pushing a version tag such as v7.1.0-beta.1 releases
    # that version instead, which is how prereleases are made.
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to release from master, such as v7.1.0 (leave empty for a normal CI run)'
        required: false
        default: ''

permissions:
  contents: read

# Releases from master run one at a time, so each one sees the tag the previous one created. GitHub keeps at most one
# run waiting: merges that land while a release is being built are released together, by the newest one.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'master-release' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      # The release being built, or empty for ordinary CI runs (pull requests, manual runs without a version).
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: version
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$MANUAL_TAG" ]]; then
            tag="$MANUAL_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            tag=$(scripts/next-version.sh)
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none}"

  build:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Shapeshifter.slnx -c Release
      - name: Unit tests
        run: dotnet test --project tests/Shapeshifter.Core.Tests -c Release --no-build

  e2e-linux:
    name: End-to-end (Linux, X11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install X server and window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb openbox x11-utils
      - name: Build
        run: dotnet build tests/Shapeshifter.EndToEnd.Tests -c Release
      - name: Copy and paste between real applications
        env:
          SHAPESHIFTER_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: scripts/run-e2e-linux.sh -c Release --no-build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linux-logs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  e2e-windows:
    name: End-to-end (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build tests/Shapeshifter.EndToEnd.Tests -c Release
      - name: Copy and paste between real applications
        env:
          SHAPESHIFTER_E2E: '1'
          SHAPESHIFTER_E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: dotnet test --project tests/Shapeshifter.EndToEnd.Tests -c Release --no-build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows-logs
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  screenshots:
    name: Screenshots (${{ matrix.look }})
    # Renders the picker with sample content (scripts/generate-screenshots.sh) so assets/screenshots always shows the
    # current design. Each look is rendered on its own operating system, so it shows in the font the app really uses
    # there (Segoe UI, SF Pro, Adwaita Sans); --native-fonts fails the job rather than render a look in another font.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { look: windows, os: windows-latest }
          - { look: macos, os: macos-latest }
          - { look: linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install Adwaita Sans
        if: matrix.look == 'linux'
        run: scripts/install-adwaita-fonts.sh
      - name: Render the ${{ matrix.look }} look
        shell: bash
        run: scripts/generate-screenshots.sh rendered --look ${{ matrix.look }} --native-fonts
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.look }}
          path: rendered

  commit-screenshots:
    name: Commit screenshots
    # On pull requests from this repository, changed screenshots are committed to the branch.
    needs: screenshots
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: assets/screenshots
          merge-multiple: true
      - name: Commit changed screenshots
        run: |
          if [[ -z "$(git status --porcelain -- assets/screenshots)" ]]; then
            echo "The screenshots are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots
          git commit -m "Update screenshots"
          git push

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, build]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, ext: .exe }
          - { rid: win-arm64, os: windows-latest, ext: .exe }
          - { rid: osx-arm64, os: macos-latest, ext: '' }
          - { rid: osx-x64, os: macos-latest, ext: '' }
          - { rid: linux-x64, os: ubuntu-latest, ext: '' }
          - { rid: linux-arm64, os: ubuntu-latest, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version from release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Manual releases must be run on master, not $GITHUB_REF"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$RELEASE_TAG is not a version tag like v7.1.0 or v7.1.0-beta.1"
            exit 1
          fi
          echo "VERSION_ARGS=-p:Version=$version" >> "$GITHUB_ENV"
      - name: Publish self-contained single-file build
        shell: bash
        run: dotnet publish src/Shapeshifter.Desktop -c Release -r ${{ matrix.rid }} -o publish/Shapeshifter $VERSION_ARGS
      - name: Name the executable after the platform
        # The single-file build is the whole app, so it is released as it is, without an archive:
        # Shapeshifter-win-x64.exe, Shapeshifter-osx-arm64, Shapeshifter-linux-x64 and so on.
        shell: bash
        run: |
          files=(publish/Shapeshifter/*)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::The single-file build should be one file, but publish/Shapeshifter holds: ${files[*]}"
            exit 1
          fi
          mv "${files[0]}" "Shapeshifter-${{ matrix.rid }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Shapeshifter-${{ matrix.rid }}
          path: Shapeshifter-${{ matrix.rid }}${{ matrix.ext }}

  release:
    name: GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, build, e2e-linux, e2e-windows, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Shapeshifter-*
          path: dist
          merge-multiple: true
      - name: Checksums
        # The updater (src/Shapeshifter.Core/Updates) refuses a download whose SHA-256 does not match this file or
        # the digest GitHub reports for the asset.
        working-directory: dist
        run: |
          sha256sum Shapeshifter-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release with the builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            target=(--verify-tag)
          elif gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; push the tag instead of starting a manual release"
            exit 1
          else
            # A merge to master or a manual run on master: tag the commit that was built and tested.
            target=(--target "$GITHUB_SHA")
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # The release was created in the GitHub UI together with the tag: keep its notes, attach the builds.
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* "${target[@]}" --title "Shapeshifter ${RELEASE_TAG#v}" --generate-notes "${prerelease[@]}"
          fi
