<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Symbolic tray icon, drawn on the 24 px grid it is shown at (2 px strokes on whole pixels). A dark (#2E3436) glyph for light panels: KDE Breeze Light, light XFCE and Cinnamon panels.
       The faint keyline in the opposite tone only matters when the panel's tone is guessed wrong. -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="18" rx="3"/>
  </g>
  <rect x="6" y="6" width="12" height="15" rx="2" fill="none" stroke="#2E3436" stroke-width="2"/>
  <rect x="9" y="3" width="6" height="3" rx="1" fill="#2E3436"/>
  <path d="M9 10 H13 A2 2 0 0 1 15 12 V17 H9 Z" fill="#2E3436"/>
</svg>
