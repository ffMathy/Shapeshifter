<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Shapeshifter, Windows look ("Mica Sheets"): three clipboard sheets, each rounder than the last. 48 px and up. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFDC7A"/><stop offset="1" stop-color="#F29A12"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7BE8D4"/><stop offset="1" stop-color="#0E9A90"/></linearGradient>
    <linearGradient id="front" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#6CC0FF"/><stop offset="0.55" stop-color="#1C80E2"/><stop offset="1" stop-color="#0A4FB0"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0A2A5C" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="40" y="34" width="128" height="158" rx="10" fill="url(#back)" transform="rotate(-12 104 113)"/>
    <rect x="60" y="52" width="140" height="168" rx="32" fill="url(#mid)" transform="rotate(-5 130 136)"/>
    <rect x="60" y="52" width="140" height="168" rx="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" transform="rotate(-5 130 136)"/>
    <path d="M100 80 H164 A56 56 0 0 1 220 136 V220 A16 16 0 0 1 204 236 H100 A16 16 0 0 1 84 220 V96 A16 16 0 0 1 100 80 Z" fill="url(#front)"/>
    <path d="M100 80 H164 A56 56 0 0 1 220 136 V220 A16 16 0 0 1 204 236 H100 A16 16 0 0 1 84 220 V96 A16 16 0 0 1 100 80 Z" fill="url(#shine)"/>
    <rect x="108" y="134" width="62" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect x="108" y="162" width="86" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect x="108" y="190" width="50" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.94"/>
  </g>
</svg>
